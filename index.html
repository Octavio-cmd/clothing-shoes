<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Savvy Scanner">
  <title>Savvy Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .print-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    :root{--bg:#0d0d0d;--sf:#1a1a1a;--sf2:#242424;--bd:#333;--tx:#fff;--mu:#888;--sv:#00e676;--dw:#ff1744;--ac:#ff6b00;--gd:#ffab00;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%}
    .hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .hdr-lg{display:flex;align-items:center;gap:10px}
    .lg-ic{width:38px;height:38px;border-radius:0;overflow:hidden;flex-shrink:0;background:transparent}.lg-ic img{width:100%;height:100%;object-fit:cover}
    .lg-tx{font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.1}.lg-pw{font-size:9px;color:var(--mu);font-weight:400;letter-spacing:.3px;margin-top:1px}
    .lg-tx span{color:var(--ac)}
    .cfg-b{background:none;border:none;color:var(--mu);font-size:22px;cursor:pointer;padding:4px}
    .scr{display:none;padding:20px 16px}.scr.on{display:block}
    .hero{text-align:center;padding:26px 0 16px}
    .hero h2{font-size:22px;font-weight:700;margin-bottom:5px}
    .hero p{color:var(--mu);font-size:14px}
    .cam-b{width:100%;background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid var(--ac);border-radius:16px;padding:28px 20px;cursor:pointer;text-align:center;margin:16px 0}
    .cam-b:active{opacity:.85;transform:scale(.98)}
    .cam-ic{font-size:44px;margin-bottom:10px}
    .cam-lb{font-size:15px;font-weight:700;color:var(--ac);letter-spacing:1px}
    .cam-ht{font-size:12px;color:var(--mu);margin-top:5px}
    .div-row{display:flex;align-items:center;gap:12px;margin:14px 0}
    .dl{flex:1;height:1px;background:var(--bd)}
    .dt{color:var(--mu);font-size:12px}
    .ir{display:flex;gap:10px}
    .ui{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;color:var(--tx);font-size:16px;outline:none}
    .ui:focus{border-color:var(--ac)}
    .ui::placeholder{color:var(--mu)}
    .sb{background:linear-gradient(135deg,#FF6B35,#E71D36);border:none;border-radius:10px;padding:14px 20px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;opacity:.35;transition:opacity .2s}
    .sb.on{opacity:1}
    #qr-video{width:100%;border-radius:12px;overflow:hidden}
    .cam-st{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;color:var(--dw);font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
    .lw{text-align:center;padding:60px 20px}
    .sp{width:56px;height:56px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 20px}
    @keyframes sp{to{transform:rotate(360deg)}}
    #lp{font-size:16px;font-weight:600;margin-bottom:8px}
    #ls{color:var(--mu);font-size:14px}
    .badge{text-align:center;padding:14px;border-radius:12px;margin-bottom:12px;font-size:26px;font-weight:900;letter-spacing:2px}
    .badge.sv{background:rgba(0,230,118,.1);border:2px solid var(--sv);color:var(--sv)}
    .badge.dw{background:rgba(255,23,68,.1);border:2px solid var(--dw);color:var(--dw)}
    .card{background:var(--sf);border-radius:12px;padding:14px;margin-bottom:10px}
    .lbl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .val{font-size:14px;font-weight:500;line-height:1.4}
    .price-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
    .pc{background:var(--sf);border-radius:12px;padding:12px 8px;text-align:center}
    .pc .lbl{margin-bottom:6px}
    .pc-num{font-size:20px;font-weight:800}
    .pc-num.low{color:#64b5f6}.pc-num.avg{color:var(--gd)}.pc-num.bdl{color:var(--sv)}
    .pc-sub{font-size:10px;color:var(--mu);margin-top:2px}
    .cost-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .cost-in{flex:1;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;color:var(--tx);font-size:16px;outline:none}
    .cost-in:focus{border-color:var(--gd)}
    .calc-btn{background:var(--gd);border:none;border-radius:8px;padding:10px 16px;color:#000;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
    .pack-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
    .pack-table th{background:var(--sf2);padding:6px 4px;text-align:center;font-size:10px;color:var(--mu);text-transform:uppercase}
    .pack-table td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--sf2)}
    .pack-table tr.best td{background:rgba(0,230,118,.08);color:var(--sv);font-weight:700}
    .add-btn{width:100%;background:var(--sv);border:none;border-radius:12px;padding:15px;color:#000;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:10px}
    .ov-add-btn{width:100%;background:transparent;border:1px solid var(--mu);border-radius:12px;padding:13px;color:var(--mu);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
    .ag-btn{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:13px;color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
    .fab{position:fixed;bottom:28px;right:18px;background:linear-gradient(135deg,#FF6B35,#E71D36);border:none;border-radius:50px;padding:13px 18px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;display:none;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(255,107,0,.4);z-index:200}
    .fab.on{display:flex}
    .fbc{background:#fff;color:var(--ac);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
    .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:300;overflow-y:auto;padding:20px 16px}
    .ov.on{display:block}
    .ovc{background:var(--sf);border-radius:16px;padding:20px;max-width:500px;margin:0 auto}
    .ovh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .ovt{font-size:18px;font-weight:800}
    .xb{background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer}
    .bi{background:var(--sf2);border-radius:10px;padding:11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .bin{flex:1;min-width:0}
    .bit{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bis{font-size:11px;color:var(--mu);margin-top:2px;font-family:monospace}
    .bip{font-size:16px;font-weight:800;color:var(--gd);margin:0 10px;flex-shrink:0}
    .bdel{background:none;border:none;color:var(--dw);font-size:18px;cursor:pointer;padding:4px 8px}
    .exp-b{width:100%;background:linear-gradient(135deg,var(--ac),var(--gd));border:none;border-radius:12px;padding:15px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:14px}
    .clr-b{width:100%;background:none;border:1px solid var(--dw);border-radius:12px;padding:11px;color:var(--dw);font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
    .empty{text-align:center;padding:36px 20px;color:var(--mu);font-size:14px;line-height:1.7}
    .sheets-btn{width:100%;background:linear-gradient(135deg,#4285F4,#34A853);border:none;border-radius:12px;padding:15px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:10px;margin-top:14px}
    .sheets-btn:active{opacity:.9;transform:scale(.98)}
    .sheets-btn.loading{opacity:.6;pointer-events:none}
    .modal-confirm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:400;align-items:center;justify-content:center;padding:20px}
    .modal-confirm.on{display:flex}
    .modal-content{background:var(--sf);border-radius:16px;padding:20px;max-width:90vw;text-align:center}
    .modal-icon{font-size:48px;margin-bottom:16px}
    .modal-text{font-size:16px;font-weight:700;margin-bottom:8px}
    .modal-subtext{font-size:14px;color:var(--mu);margin-bottom:20px}
    .modal-btn{background:var(--ac);border:none;border-radius:10px;padding:12px 24px;color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="hdr">
    <div class="hdr-lg">
      <div class="lg-tx">Savvy <span>Scanner</span></div>
      <div class="lg-pw">clothing-shoes</div>
    </div>
  </div>

  <div class="scr on" id="mainScr">
    <div class="hero">
      <h2>Clothing & Shoes</h2>
      <p>Escanea productos de ropa y zapatos</p>
    </div>

    <div class="cam-b" id="startBtn">
      <div class="cam-ic">📷</div>
      <div class="cam-lb">ESCANEAR CÓDIGO</div>
    </div>

    <div id="qrContainer" style="display:none">
      <video id="qr-video"></video>
      <button class="cam-st" id="stopBtn">Detener cámara</button>
    </div>

    <div id="productContainer" style="display:none">
      <div class="card">
        <div class="lbl">Código de Barras</div>
        <div class="val" id="barcodeVal">-</div>
      </div>

      <div class="card">
        <div class="lbl">Marca</div>
        <input type="text" class="ui" id="brandInput" placeholder="Nike, Adidas...">
      </div>

      <div class="card">
        <div class="lbl">Título</div>
        <input type="text" class="ui" id="titleInput" placeholder="Polo Azul Talla M">
      </div>

      <div class="card">
        <div class="lbl">Descripción</div>
        <textarea class="ui" id="descInput" placeholder="Detalles..." style="resize:vertical;min-height:80px"></textarea>
      </div>

      <div class="card">
        <div class="lbl">Precio</div>
        <input type="number" class="ui" id="priceInput" placeholder="49.99" step="0.01">
      </div>

      <div class="card">
        <div class="lbl">Localización</div>
        <input type="text" class="ui" id="locationInput" placeholder="Estante C, Fila 3">
      </div>

      <div class="card">
        <div class="lbl">Estado</div>
        <select class="ui" id="statusInput">
          <option value="No Listado">No Listado</option>
          <option value="Listado">Listado</option>
          <option value="Error">Error</option>
        </select>
      </div>

      <div class="card">
        <div class="lbl">Notas</div>
        <textarea class="ui" id="notesInput" placeholder="Notas adicionales..." style="resize:vertical;min-height:60px"></textarea>
      </div>

      <button class="sheets-btn" id="sheetsBtn">📊 Guardar en Google Sheets</button>
      <button class="ag-btn" id="nextBtn">➕ Siguiente Producto</button>
      <button class="clr-b" id="clearBtn">Limpiar</button>
    </div>
  </div>

  <!-- MODAL DE CONFIRMACIÓN -->
  <div class="modal-confirm" id="confirmModal">
    <div class="modal-content">
      <div class="modal-icon" id="confirmIcon">✅</div>
      <div class="modal-text" id="confirmText">¡Guardado!</div>
      <div class="modal-subtext" id="confirmSubtext">El producto se guardó en Google Sheets</div>
      <button class="modal-btn" id="confirmBtn">OK</button>
    </div>
  </div>

  <script>
    const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyHMHRRi2vI3VZYLAQAGrzmp6TVae0H9WFk6YxD0WplhVVG-P-N7ZeavaX_bvT5A5Bu4Q/exec';

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const qrContainer = document.getElementById('qrContainer');
    const productContainer = document.getElementById('productContainer');
    const sheetsBtn = document.getElementById('sheetsBtn');
    const nextBtn = document.getElementById('nextBtn');
    const clearBtn = document.getElementById('clearBtn');
    const confirmModal = document.getElementById('confirmModal');
    const confirmBtn = document.getElementById('confirmBtn');

    const barcodeVal = document.getElementById('barcodeVal');
    const brandInput = document.getElementById('brandInput');
    const titleInput = document.getElementById('titleInput');
    const descInput = document.getElementById('descInput');
    const priceInput = document.getElementById('priceInput');
    const locationInput = document.getElementById('locationInput');
    const statusInput = document.getElementById('statusInput');
    const notesInput = document.getElementById('notesInput');

    let currentBarcode = '';
    let html5QrcodeScanner = null;

    startBtn.addEventListener('click', () => {
      qrContainer.style.display = 'block';
      startBtn.style.display = 'none';

      html5QrcodeScanner = new Html5Qrcode('qr-video');
      html5QrcodeScanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          currentBarcode = decodedText;
          barcodeVal.textContent = decodedText;
          html5QrcodeScanner.stop();
          qrContainer.style.display = 'none';
          productContainer.style.display = 'block';
        },
        (error) => console.warn('QR error:', error)
      );
    });

    stopBtn.addEventListener('click', () => {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop();
        qrContainer.style.display = 'none';
        startBtn.style.display = 'block';
      }
    });

    sheetsBtn.addEventListener('click', async () => {
      sheetsBtn.classList.add('loading');
      sheetsBtn.textContent = 'Guardando...';

      const params = new URLSearchParams({
        marca: brandInput.value || '',
        titulo: titleInput.value || '',
        descripcion: descInput.value || '',
        precio: priceInput.value || '',
        localizacion: locationInput.value || '',
        foto: '',
        upc: currentBarcode,
        estado: statusInput.value || '',
        notas: notesInput.value || ''
      });

      try {
        const response = await fetch(SHEETS_URL, { method: 'POST', body: params });
        const result = await response.json();

        if (result.success) {
          showConfirm('✅', '¡Guardado!', 'El producto se guardó en Google Sheets');
        } else {
          showConfirm('❌', 'Error', result.message || 'No se pudo guardar');
        }
      } catch (error) {
        showConfirm('❌', 'Error', error.message);
      }

      sheetsBtn.classList.remove('loading');
      sheetsBtn.textContent = '📊 Guardar en Google Sheets';
    });

    nextBtn.addEventListener('click', () => {
      clearForm();
      productContainer.style.display = 'none';
      startBtn.style.display = 'block';
    });

    clearBtn.addEventListener('click', clearForm);

    function clearForm() {
      brandInput.value = '';
      titleInput.value = '';
      descInput.value = '';
      priceInput.value = '';
      locationInput.value = '';
      statusInput.value = 'No Listado';
      notesInput.value = '';
      barcodeVal.textContent = '-';
      currentBarcode = '';
    }

    function showConfirm(icon, text, subtext) {
      document.getElementById('confirmIcon').textContent = icon;
      document.getElementById('confirmText').textContent = text;
      document.getElementById('confirmSubtext').textContent = subtext;
      confirmModal.classList.add('on');
    }

    confirmBtn.addEventListener('click', () => {
      confirmModal.classList.remove('on');
    });

    console.log('✅ Clothing-Shoes con Google Sheets cargado');
  </script>
</body>
</html>
