<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Savvy Scanner">
  <title>Savvy Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --sf: #1a1a1a;
      --bd: #333;
      --tx: #fff;
      --mu: #888;
      --ac: #ff6b00;
      --dw: #ff1744;
      --sv: #00e676;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: var(--bg);
      color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding-bottom: 40px;
    }
    
    .header {
      background: var(--sf);
      border-bottom: 1px solid var(--bd);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 800;
    }
    
    .header span {
      color: var(--ac);
    }
    
    .module-switch {
      display: flex;
      gap: 8px;
      background: var(--bg);
      padding: 8px;
      border-radius: 8px;
    }
    
    .module-btn {
      flex: 1;
      background: var(--bd);
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--mu);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    
    .module-btn.active {
      background: var(--ac);
      color: #fff;
    }
    
    .container {
      max-width: 100%;
      padding: 16px;
    }
    
    .screen {
      display: none;
    }
    
    .screen.active {
      display: block;
    }
    
    .section {
      margin-bottom: 20px;
      text-align: center;
    }
    
    .section h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    
    .section p {
      color: var(--mu);
      font-size: 14px;
    }
    
    .btn-scan {
      width: 100%;
      background: linear-gradient(135deg, #ff6b00, #e71d36);
      border: 2px solid var(--ac);
      border-radius: 14px;
      padding: 24px;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin: 16px 0;
    }
    
    .btn-scan:active {
      opacity: 0.85;
    }
    
    .scan-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    
    #qr-video-ps, #qr-video-cs {
      width: 100%;
      border-radius: 12px;
      margin: 16px 0;
    }
    
    .form-group {
      background: var(--sf);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    
    .label {
      font-size: 11px;
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: block;
    }
    
    .required {
      color: var(--dw);
      font-weight: 800;
    }
    
    .input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 12px;
      color: var(--tx);
      font-size: 16px;
      font-family: inherit;
    }
    
    .input:focus {
      outline: none;
      border-color: var(--ac);
    }
    
    .input.error {
      border-color: var(--dw);
      background: rgba(255, 23, 68, 0.05);
    }
    
    .error-msg {
      display: none;
      background: rgba(255, 23, 68, 0.1);
      border: 1px solid var(--dw);
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      color: var(--dw);
      font-size: 14px;
      font-weight: 600;
    }
    
    .error-msg.show {
      display: block;
    }
    
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 10px;
    }
    
    .btn-next {
      background: linear-gradient(135deg, #ff6b00, #e71d36);
      color: #fff;
    }
    
    .btn-next:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    .btn-next:active:not(:disabled) {
      opacity: 0.9;
    }
    
    .btn-clear {
      background: none;
      border: 1px solid var(--bd);
      color: var(--mu);
    }
    
    .btn-stop {
      background: var(--sf);
      border: 1px solid var(--bd);
      color: var(--dw);
    }
    
    .value {
      font-size: 14px;
      font-weight: 500;
    }
    
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .modal.show {
      display: flex;
    }
    
    .modal-content {
      background: var(--sf);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      max-width: 90vw;
    }
    
    .modal-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .modal-text {
      color: var(--mu);
      font-size: 14px;
      margin-bottom: 16px;
    }
    
    .modal-btn {
      background: var(--ac);
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- HEADER CON SELECTOR DE MÓDULOS -->
  <div class="header">
    <div class="header-top">
      <h1>Savvy <span>Scanner</span></h1>
    </div>
    <div class="module-switch">
      <button class="module-btn active" id="psBtn">📦 Product</button>
      <button class="module-btn" id="csBtn">👕 Clothing</button>
    </div>
  </div>

  <div class="container">
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- MÓDULO 1: PRODUCT SCANNER -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div class="screen active" id="psScreen">
      <div class="section">
        <h2>Product Scanner</h2>
        <p>Escanea código y toma foto</p>
      </div>

      <button class="btn-scan" id="psScan">
        <div class="scan-icon">📷</div>
        <div>ESCANEAR CÓDIGO</div>
      </button>

      <div id="psQrContainer" style="display:none;">
        <video id="qr-video-ps"></video>
        <button class="btn btn-stop" id="psStop">Detener</button>
      </div>

      <div id="psForm" style="display:none;">
        <div class="error-msg" id="psErrorMsg"></div>
        
        <div class="form-group">
          <label class="label">Código de Barras</label>
          <div class="value" id="psBarcode">-</div>
        </div>

        <div class="form-group">
          <label class="label">Marca <span class="required">*</span></label>
          <input type="text" class="input" id="psBrand" placeholder="Nike, Adidas...">
        </div>

        <div class="form-group">
          <label class="label">Título <span class="required">*</span></label>
          <input type="text" class="input" id="psTitle" placeholder="Producto...">
        </div>

        <div class="form-group">
          <label class="label">Descripción <span class="required">*</span></label>
          <textarea class="input" id="psDesc" placeholder="Detalles..." style="resize:vertical;min-height:80px;"></textarea>
        </div>

        <div class="form-group">
          <label class="label">Precio Estimado <span class="required">*</span></label>
          <input type="number" class="input" id="psPrice" placeholder="49.99" step="0.01">
        </div>

        <button class="btn btn-next" id="psNext" disabled>➕ Siguiente Producto</button>
        <button class="btn btn-clear" id="psClear">Limpiar</button>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- MÓDULO 2: CLOTHING-SHOES -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div class="screen" id="csScreen">
      <div class="section">
        <h2>Clothing & Shoes</h2>
        <p>Completa todos los campos marcados con *</p>
      </div>

      <button class="btn-scan" id="csScan">
        <div class="scan-icon">📷</div>
        <div>ESCANEAR CÓDIGO</div>
      </button>

      <div id="csQrContainer" style="display:none;">
        <video id="qr-video-cs"></video>
        <button class="btn btn-stop" id="csStop">Detener</button>
      </div>

      <div id="csForm" style="display:none;">
        <div class="error-msg" id="csErrorMsg"></div>
        
        <div class="form-group">
          <label class="label">Código de Barras</label>
          <div class="value" id="csBarcode">-</div>
        </div>

        <div class="form-group">
          <label class="label">Marca <span class="required">*</span></label>
          <input type="text" class="input" id="csBrand" placeholder="Nike, Adidas...">
        </div>

        <div class="form-group">
          <label class="label">Título <span class="required">*</span></label>
          <input type="text" class="input" id="csTitle" placeholder="Polo Azul Talla M">
        </div>

        <div class="form-group">
          <label class="label">Descripción <span class="required">*</span></label>
          <textarea class="input" id="csDescription" placeholder="Detalles..." style="resize:vertical;min-height:80px;"></textarea>
        </div>

        <div class="form-group">
          <label class="label">Color <span class="required">*</span></label>
          <input type="text" class="input" id="csColor" placeholder="Azul, Rojo, Negro...">
        </div>

        <div class="form-group">
          <label class="label">Material <span class="required">*</span></label>
          <select class="input" id="csMaterial">
            <option value="">-- Selecciona --</option>
            <option value="Algodón">Algodón</option>
            <option value="Poliéster">Poliéster</option>
            <option value="Lana">Lana</option>
            <option value="Seda">Seda</option>
            <option value="Mezcla">Mezcla</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label class="label">Talla <span class="required">*</span></label>
          <select class="input" id="csSize">
            <option value="">-- Selecciona --</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
            <option value="XXXL">XXXL</option>
            <option value="One Size">One Size</option>
          </select>
        </div>

        <div class="form-group" id="csDressLengthGroup" style="display:none;">
          <label class="label">Largo del Vestido <span class="required">*</span></label>
          <select class="input" id="csDressLength">
            <option value="">-- Selecciona --</option>
            <option value="Mini">Mini</option>
            <option value="Knee">Hasta la rodilla</option>
            <option value="Midi">Midi</option>
            <option value="Maxi">Maxi</option>
            <option value="Floor">Floor length</option>
          </select>
        </div>

        <div class="form-group" id="csStyleGroup" style="display:none;">
          <label class="label">Estilo <span class="required">*</span></label>
          <input type="text" class="input" id="csStyle" placeholder="Casual, Formal, Deportivo...">
        </div>

        <div class="form-group">
          <label class="label">Estado <span class="required">*</span></label>
          <select class="input" id="csCondition">
            <option value="">-- Selecciona --</option>
            <option value="Nuevo">Nuevo con etiqueta</option>
            <option value="Nuevo sin etiqueta">Nuevo sin etiqueta</option>
            <option value="Como nuevo">Como nuevo</option>
            <option value="Muy bien">Muy bien</option>
            <option value="Bien">Bien</option>
          </select>
        </div>

        <div class="form-group">
          <label class="label">Precio Estimado <span class="required">*</span></label>
          <input type="number" class="input" id="csPrice" placeholder="49.99" step="0.01">
        </div>

        <div class="form-group">
          <label class="label">Localización <span class="required">*</span></label>
          <input type="text" class="input" id="csLocation" placeholder="Estante C, Fila 3">
        </div>

        <div class="form-group">
          <label class="label">Notas (Opcional)</label>
          <textarea class="input" id="csNotes" placeholder="Notas adicionales..." style="resize:vertical;min-height:60px;"></textarea>
        </div>

        <button class="btn btn-next" id="csNext" disabled>➕ Siguiente Producto</button>
        <button class="btn btn-clear" id="csClear">Limpiar</button>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon">✅</div>
      <div class="modal-title" id="modalTitle">¡Listo!</div>
      <div class="modal-text" id="modalText">Producto registrado</div>
      <button class="modal-btn" id="modalBtn">OK</button>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // SELECTOR DE MÓDULOS
    // ═══════════════════════════════════════════════════════════════
    const psBtn = document.getElementById('psBtn');
    const csBtn = document.getElementById('csBtn');
    const psScreen = document.getElementById('psScreen');
    const csScreen = document.getElementById('csScreen');

    psBtn.addEventListener('click', () => {
      psScreen.classList.add('active');
      csScreen.classList.remove('active');
      psBtn.classList.add('active');
      csBtn.classList.remove('active');
    });

    csBtn.addEventListener('click', () => {
      csScreen.classList.add('active');
      psScreen.classList.remove('active');
      csBtn.classList.add('active');
      psBtn.classList.remove('active');
    });

    // ═══════════════════════════════════════════════════════════════
    // PRODUCT SCANNER
    // ═══════════════════════════════════════════════════════════════
    const psScan = document.getElementById('psScan');
    const psStop = document.getElementById('psStop');
    const psQrContainer = document.getElementById('psQrContainer');
    const psForm = document.getElementById('psForm');
    const psBarcode = document.getElementById('psBarcode');
    const psBrand = document.getElementById('psBrand');
    const psTitle = document.getElementById('psTitle');
    const psDesc = document.getElementById('psDesc');
    const psPrice = document.getElementById('psPrice');
    const psNext = document.getElementById('psNext');
    const psClear = document.getElementById('psClear');
    const psErrorMsg = document.getElementById('psErrorMsg');
    let psScanner = null;

    psScan.addEventListener('click', () => {
      psQrContainer.style.display = 'block';
      psScan.style.display = 'none';

      psScanner = new Html5Qrcode('qr-video-ps');
      psScanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (text) => {
          psBarcode.textContent = text;
          psScanner.stop();
          psQrContainer.style.display = 'none';
          psForm.style.display = 'block';
          validatePS();
        },
        (err) => console.warn(err)
      );
    });

    psStop.addEventListener('click', () => {
      if (psScanner) {
        psScanner.stop();
        psQrContainer.style.display = 'none';
        psScan.style.display = 'block';
      }
    });

    function validatePS() {
      const missing = [];
      if (!psBrand.value.trim()) missing.push('Marca');
      if (!psTitle.value.trim()) missing.push('Título');
      if (!psDesc.value.trim()) missing.push('Descripción');
      if (!psPrice.value) missing.push('Precio');

      if (missing.length > 0) {
        psErrorMsg.textContent = '⚠️ Falta: ' + missing.join(', ');
        psErrorMsg.classList.add('show');
        psNext.disabled = true;
      } else {
        psErrorMsg.classList.remove('show');
        psNext.disabled = false;
      }
    }

    [psBrand, psTitle, psDesc, psPrice].forEach(el => {
      el.addEventListener('input', validatePS);
    });

    psNext.addEventListener('click', () => {
      if (!psNext.disabled) {
        showModal('✅', '¡Listo!', 'Producto registrado');
        setTimeout(() => {
          clearPS();
          psForm.style.display = 'none';
          psScan.style.display = 'block';
        }, 1500);
      }
    });

    psClear.addEventListener('click', clearPS);

    function clearPS() {
      psBrand.value = '';
      psTitle.value = '';
      psDesc.value = '';
      psPrice.value = '';
      psBarcode.textContent = '-';
      psErrorMsg.classList.remove('show');
      psNext.disabled = true;
    }

    // ═══════════════════════════════════════════════════════════════
    // CLOTHING-SHOES
    // ═══════════════════════════════════════════════════════════════
    const csScan = document.getElementById('csScan');
    const csStop = document.getElementById('csStop');
    const csQrContainer = document.getElementById('csQrContainer');
    const csForm = document.getElementById('csForm');
    const csBarcode = document.getElementById('csBarcode');
    const csBrand = document.getElementById('csBrand');
    const csTitle = document.getElementById('csTitle');
    const csDescription = document.getElementById('csDescription');
    const csColor = document.getElementById('csColor');
    const csMaterial = document.getElementById('csMaterial');
    const csSize = document.getElementById('csSize');
    const csDressLength = document.getElementById('csDressLength');
    const csStyle = document.getElementById('csStyle');
    const csCondition = document.getElementById('csCondition');
    const csPrice = document.getElementById('csPrice');
    const csLocation = document.getElementById('csLocation');
    const csNotes = document.getElementById('csNotes');
    const csNext = document.getElementById('csNext');
    const csClear = document.getElementById('csClear');
    const csErrorMsg = document.getElementById('csErrorMsg');
    const csDressLengthGroup = document.getElementById('csDressLengthGroup');
    const csStyleGroup = document.getElementById('csStyleGroup');
    let csScanner = null;

    const csRequired = ['csBrand', 'csTitle', 'csDescription', 'csColor', 'csMaterial', 'csSize', 'csCondition', 'csPrice', 'csLocation'];

    csScan.addEventListener('click', () => {
      csQrContainer.style.display = 'block';
      csScan.style.display = 'none';

      csScanner = new Html5Qrcode('qr-video-cs');
      csScanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (text) => {
          csBarcode.textContent = text;
          csScanner.stop();
          csQrContainer.style.display = 'none';
          csForm.style.display = 'block';
          validateCS();
        },
        (err) => console.warn(err)
      );
    });

    csStop.addEventListener('click', () => {
      if (csScanner) {
        csScanner.stop();
        csQrContainer.style.display = 'none';
        csScan.style.display = 'block';
      }
    });

    function validateCS() {
      const missing = [];
      csRequired.forEach(id => {
        const el = document.getElementById(id);
        if (!el.value.trim()) {
          missing.push(el.parentElement.querySelector('.label').textContent.split('*')[0].trim());
          el.classList.add('error');
        } else {
          el.classList.remove('error');
        }
      });

      if (csDressLengthGroup.style.display !== 'none' && !csDressLength.value) {
        missing.push('Largo del Vestido');
        csDressLength.classList.add('error');
      } else {
        csDressLength.classList.remove('error');
      }

      if (csStyleGroup.style.display !== 'none' && !csStyle.value.trim()) {
        missing.push('Estilo');
        csStyle.classList.add('error');
      } else {
        csStyle.classList.remove('error');
      }

      if (missing.length > 0) {
        csErrorMsg.textContent = '⚠️ Falta: ' + missing.join(', ');
        csErrorMsg.classList.add('show');
        csNext.disabled = true;
      } else {
        csErrorMsg.classList.remove('show');
        csNext.disabled = false;
      }
    }

    [csBrand, csTitle, csDescription, csColor, csMaterial, csSize, csCondition, csPrice, csLocation, csDressLength, csStyle].forEach(el => {
      el.addEventListener('input', validateCS);
      el.addEventListener('change', validateCS);
    });

    csNext.addEventListener('click', () => {
      if (!csNext.disabled) {
        showModal('✅', '¡Listo!', 'Producto registrado');
        setTimeout(() => {
          clearCS();
          csForm.style.display = 'none';
          csScan.style.display = 'block';
        }, 1500);
      }
    });

    csClear.addEventListener('click', clearCS);

    function clearCS() {
      csBrand.value = '';
      csTitle.value = '';
      csDescription.value = '';
      csColor.value = '';
      csMaterial.value = '';
      csSize.value = '';
      csDressLength.value = '';
      csStyle.value = '';
      csCondition.value = '';
      csPrice.value = '';
      csLocation.value = '';
      csNotes.value = '';
      csBarcode.textContent = '-';
      csErrorMsg.classList.remove('show');
      csNext.disabled = true;
      [csBrand, csTitle, csDescription, csColor, csMaterial, csSize, csDressLength, csStyle, csCondition, csPrice, csLocation].forEach(el => {
        el.classList.remove('error');
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // MODAL
    // ═══════════════════════════════════════════════════════════════
    const modal = document.getElementById('modal');
    const modalBtn = document.getElementById('modalBtn');

    function showModal(icon, title, text) {
      document.getElementById('modalIcon').textContent = icon;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalText').textContent = text;
      modal.classList.add('show');
    }

    modalBtn.addEventListener('click', () => {
      modal.classList.remove('show');
    });

    console.log('✅ Savvy Scanner - Dos módulos cargados');
  </script>
</body>
</html>
